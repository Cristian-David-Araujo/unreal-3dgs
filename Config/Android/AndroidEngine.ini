; =============================================================================
; Config/Android/AndroidEngine.ini
; =============================================================================
; Platform-specific engine overrides for Android / Meta Quest 3 and Pro.
;
; These settings OVERRIDE the values in Config/DefaultEngine.ini when building
; or running on an Android device.  They are NOT applied on Windows/PC builds.
;
; WHY each override is needed is documented inline.
; =============================================================================

; -----------------------------------------------------------------------------
; Renderer — disable features unsupported or too expensive on Quest 3 / Pro
; -----------------------------------------------------------------------------
[/Script/Engine.RendererSettings]

; Ray Tracing is desktop-only hardware; must be disabled on Android.
r.RayTracing=False

; Lumen GI requires ray tracing or heavy hardware — not available on Quest.
r.DynamicGlobalIlluminationMethod=0

; Lumen Reflections — same reason as Lumen GI.
r.ReflectionMethod=0

; Nanite requires a specific GBuffer layout not present on Vulkan mobile.
r.Nanite.ProjectEnabled=False

; Virtual Shadow Maps are desktop-only at this time.
r.Shadow.Virtual.Enable=0

; MSAA is the standard AA mode for mobile VR (avoids TAA ghosting in VR).
; 0=None, 1=FXAA, 2=TAA, 4=MSAA
r.AntiAliasingMethod=4

; Mesh Distance Fields need too much memory on Quest.
r.GenerateMeshDistanceFields=False

; Ambient Occlusion — too expensive for mobile VR.
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False

; Bloom is optional but kept enabled for visual quality — toggle as needed.
r.DefaultFeature.Bloom=False

; Motion Blur causes VR discomfort; always disable.
r.DefaultFeature.MotionBlur=False

; Auto Exposure: keep disabled for stable VR visuals.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=False

; Skin Cache shader compilation not needed on mobile.
r.SkinCache.CompileShaders=False

; Occlusion queries — disable as they add CPU overhead on Quest.
r.AllowOcclusionQueries=False

; Static lighting not used in this project.
r.AllowStaticLighting=False

; -----------------------------------------------------------------------------
; Mobile HDR — Quest 3 / Pro support sRGB and HDR rendering via Vulkan.
; Set to True for full HDR pipeline; False reduces bandwidth on Quest Pro.
; -----------------------------------------------------------------------------
[/Script/Engine.MobileHDR]
bMobileHDR=True

; -----------------------------------------------------------------------------
; Vulkan RHI — Quest 3 and Pro require Vulkan.
; The Android project settings select Vulkan as the ONLY RHI (see below).
; -----------------------------------------------------------------------------
[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]

; Minimum Android API level.
; Quest 3 / Pro require API 32 (Android 12L).
MinSDKVersion=32
TargetSDKVersion=32

; Architecture — arm64 only (Quest 2/3/Pro are all arm64).
bBuildForArmV7=False
bBuildForArm64=True
bBuildForX8664=False

; Graphics APIs — Vulkan only for Quest 3/Pro.
; Keeping ES3.1 as a fallback is possible but adds shader compile time.
bSupportsVulkan=True
bBuildForES31=False
bSupportsVulkanSM5=False

; ASTC hardware texture compression — Quest 3 / Pro support ASTC HDR.
bEnableHWASTCSupport=True

; Package name — change to match your organisation / bundle ID.
PackageName=com.yourcompany.unrealsplat

; App display name shown in Quest's app library.
ApplicationDisplayName=UnrealSplat

; Store version is bumped automatically by CI; do not edit manually.
StoreVersion=1

; Install to internal storage (required for Quest standalone apps).
InstallLocation=InternalOnly

; Disable Google Play (not used for sideloaded / Meta Store builds).
bEnableGooglePlaySupport=False

; Hand tracking permission — enables hand tracking on Quest 3.
; Remove this line if your app does not use hand tracking.
ExtraPermissions=(Permission="com.oculus.permission.HAND_TRACKING")

; -----------------------------------------------------------------------------
; OpenXR — cross-platform XR runtime used by both OculusXR and future devices
; -----------------------------------------------------------------------------
[/Script/OpenXRHMD.OpenXRHMDSettings]
; Use the Meta OpenXR runtime when running on Quest.
bEnable=True

; -----------------------------------------------------------------------------
; OculusXR — Meta-specific extensions (Fixed Foveated Rendering, etc.)
; -----------------------------------------------------------------------------
[/Script/OculusXR.OculusXRHMDRuntimeSettings]

; Fixed Foveated Rendering: reduces GPU load by rendering edges at lower res.
; Levels: 0=Off, 1=Low, 2=Medium, 3=High, 4=HighTop
FFRLevel=2

; Eye-tracked Foveated Rendering uses Quest Pro's eye tracker for dynamic FFR.
; Set to True only if your app requires Eye Tracking entitlement.
bDynamicFFR=False

; CPU and GPU performance levels for Quest 3 (0=lowest, 5=highest, -1=auto)
; Start with defaults and profile in RenderDoc / OVR Metrics Tool.
CPULevel=2
GPULevel=3

; Enable phase sync to reduce motion-to-photon latency.
bPhaseSync=True

; Enable multiview rendering (renders both eyes in one pass — major perf win).
bMultiView=True

; Enable guardian-free passthrough awareness.
bInsightPassthroughEnabled=False

; -----------------------------------------------------------------------------
; Android File Server (AFS) — for over-USB asset streaming during development
; -----------------------------------------------------------------------------
[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
bIncludeInShipping=False
ConnectionType=USBOnly

; -----------------------------------------------------------------------------
; Niagara — keep GPU simulation enabled on Vulkan (required for 3DGS rendering)
; -----------------------------------------------------------------------------
[/Script/Niagara.NiagaraSettings]
; Ensure GPU simulations are allowed on Android Vulkan.
bAllowGPUParticles=True
